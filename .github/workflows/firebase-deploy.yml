# פריסה אוטומטית ל-Firebase (Hosting + Functions) — project ramada-elev.
#
# הפעלה:
#   • אוטומטית: push ל-main שנוגע ב-functions/ · public/ · firebase.json · ‎.firebaserc
#   • ידנית:   Actions → "Deploy to Firebase" → Run workflow (אפשר לבחור מה לפרוס)
#
# חד-פעמי לפני שעובד (ראו functions/README.md):
#   1) שדרוג הפרויקט ל-Blaze.
#   2) הגדרת Secrets של הפונקציות:  firebase functions:secrets:set TELEGRAM_BOT_TOKEN  (וכו')
#   3) הוספת secret אימות לריפו ב-GitHub (Settings → Secrets and variables → Actions):
#        FIREBASE_SERVICE_ACCOUNT  — JSON של Service Account (מומלץ), או
#        FIREBASE_TOKEN            — פלט של `firebase login:ci` (פשוט יותר, מיושן).
name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "public/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "מה לפרוס"
        type: choice
        default: "functions,hosting"
        options:
          - "functions,hosting"
          - "functions"
          - "hosting"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: התקנת תלויות הפונקציות
        run: npm ci
        working-directory: functions

      - name: בדיקות (חישוב יום/לילה + watchdog)
        run: npm test
        working-directory: functions

      - name: התקנת Firebase CLI
        run: npm install -g firebase-tools

      - name: פריסה
        env:
          TARGET: ${{ github.event.inputs.target || 'functions,hosting' }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -e
          if [ -n "$SA" ]; then
            echo "$SA" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            firebase deploy --only "$TARGET" --project ramada-elev --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only "$TARGET" --project ramada-elev --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo "::error::חסר secret לאימות — הוסף FIREBASE_SERVICE_ACCOUNT (מומלץ) או FIREBASE_TOKEN ל-Secrets של הריפו."
            exit 1
          fi
