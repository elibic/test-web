# ⚠️ HOSTING עבר למונו-רפו. פריסת ה-HOSTING של test-94822 מתבצעת ממקור-האמת היחיד בריפו
#    ramada-web תחת monorepo/ (workflows: preview-project.yml / deploy-all.yml). לכן ה-workflow
#    הזה **אינו** פורס hosting יותר, ואינו רץ אוטומטית על push - כדי שלא ירוצו שתי פריסות על
#    אותו פרויקט. נשאר כאן רק פריסת FUNCTIONS ידנית (extractTheme), אם וכשצריך.
#
# חד-פעמי (ראו functions/README.md): Blaze + Secrets + FIREBASE_SERVICE_ACCOUNT ברירי הריפו.
name: Deploy to Firebase (functions only)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "מה לפרוס (functions בלבד - hosting עבר למונו-רפו)"
        type: choice
        default: "functions:extractTheme"
        options:
          - "functions:extractTheme"
          - "functions"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: התקנת תלויות הפונקציות
        run: npm ci
        working-directory: functions

      - name: התקנת Firebase CLI
        run: npm install -g firebase-tools

      - name: פריסת functions
        env:
          TARGET: ${{ github.event.inputs.target || 'functions:extractTheme' }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -e
          if [ -n "$SA" ]; then
            echo "$SA" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            firebase deploy --only "$TARGET" --project test-94822 --non-interactive --force
          elif [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only "$TARGET" --project test-94822 --non-interactive --force --token "$FIREBASE_TOKEN"
          else
            echo "::error::חסר secret לאימות — הוסף FIREBASE_SERVICE_ACCOUNT (מומלץ) או FIREBASE_TOKEN ל-Secrets של הריפו."
            exit 1
          fi
