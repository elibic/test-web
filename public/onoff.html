<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפעלת מצב שבת</title>
    <link href="https://fonts.googleapis.com/css?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #252540 100%); color: #c5a47e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; box-sizing: border-box; }
        h1, h2 { color: #c5a47e; margin-bottom: 20px; }
        .container { background: rgba(26, 26, 46, 0.97); border-radius: 28px; box-shadow: 0 6px 48px #0007, 0 1.5px 3px #c5a47e40 inset; padding: 30px; width: 90%; max-width: 480px; border: 2px solid #c5a47e; margin-bottom: 20px; }

        /* Auth */
        .form-group { margin-bottom: 15px; text-align: right; }
        input { width: 100%; padding: 10px; border: 1px solid #c5a47e; border-radius: 8px; background-color: rgba(255, 255, 255, 0.1); color: #c5a47e; box-sizing: border-box; font-family: inherit; font-size: 0.95em; }
        button { background: linear-gradient(135deg, #252540 60%, #1a1a2e 100%); color: #c5a47e; border: 2px solid #c5a47e; border-radius: 18px; font-size: 1.1em; font-family: inherit; padding: 10px 25px; cursor: pointer; font-weight: bold; transition: all 0.2s; width: 100%; margin-top: 10px; }
        button:hover { background: linear-gradient(135deg, #1a1a2e 40%, #c5a47e 120%); color: #ddc9a8; }
        .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; color: #333; border-color: #fff; }
        .social-btn:hover { background: #f0f0f0; color: #000; }
        .back-btn { background: transparent; border-color: #c5a47e80; }
        .auth-view { display: none; flex-direction: column; gap: 15px; }
        .auth-view.active { display: flex; }
        .forgot-password { color: #c5a47e; text-decoration: underline; cursor: pointer; font-size: 0.9em; text-align: center; margin-top: 5px; display: block; }
        .logout-btn { background-color: #d32f2f; border-color: #d32f2f; margin-top: 15px; }

        /* Elevator Cards */
        .elevator-card { border: 1px solid #c5a47e50; border-radius: 15px; padding: 20px; margin-bottom: 15px; background: rgba(255, 255, 255, 0.03); text-align: right; }
        .elevator-card h3 { margin: 0 0 15px 0; font-size: 1.2em; }

        /* Toggle */
        .toggle-row { display: flex; align-items: center; justify-content: space-between; background: rgba(236, 208, 143, 0.08); padding: 14px 16px; border-radius: 10px; }
        .toggle-label { font-size: 1.05em; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 48px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .3s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #c5a47e; }
        input:checked + .slider:before { transform: translateX(22px); }
        .status-text { font-size: 0.8em; color: #888; margin-top: 8px; text-align: center; }
        .status-text.active { color: #c5a47e; }

        /* General settings card */
        .general-card { border: 1px solid #c5a47e50; border-radius: 15px; padding: 20px; margin-bottom: 20px; background: rgba(197, 164, 126, 0.05); text-align: right; }
        .general-card h3 { margin: 0 0 4px 0; font-size: 1em; color: #ddc9a8; letter-spacing: 0.3px; }
        .general-card .section-desc { font-size: 0.78em; color: #777; margin: 0 0 14px 0; }
        .toggle-sub { font-size: 0.78em; color: #888; margin-top: 4px; }

        /* Save button */
        .save-btn { background: #c5a47e; color: #1a1a2e; border-color: #c5a47e; font-size: 1.15em; margin-top: 5px; }
        .save-btn:hover { background: #ddc9a8; border-color: #ddc9a8; color: #1a1a2e; }

        /* Notification */
        .notification { visibility: hidden; opacity: 0; min-width: 200px; background: #c5a47e; color: #1a1a2e; text-align: center; border-radius: 12px; padding: 15px 25px; position: fixed; z-index: 1001; left: 50%; bottom: 50px; font-size: 1em; transform: translateX(-50%); box-shadow: 0 2px 18px #0007; transition: opacity 0.3s, visibility 0.3s; font-weight: bold; }
        .notification.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <!-- AUTH -->
    <div id="authContainer" class="container">
        <h2>כניסה</h2>
        <div id="auth-main" class="auth-view active">
            <button id="googleSignInBtn" class="social-btn">
                <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                התחבר עם Google
            </button>
            <button id="emailSignInBtn">התחבר עם אימייל וסיסמה</button>
        </div>
        <div id="auth-email" class="auth-view">
            <form id="loginForm">
                <div class="form-group"><input type="email" id="loginEmail" placeholder="אימייל" required></div>
                <div class="form-group"><input type="password" id="loginPassword" placeholder="סיסמה" required></div>
                <button type="submit">התחבר</button>
            </form>
            <a class="forgot-password" id="forgotPasswordLink">שכחתי סיסמה</a>
            <button class="back-btn" data-target="auth-main">חזור</button>
        </div>
    </div>

    <!-- CONTROL PANEL -->
    <div id="controlContainer" class="container" style="display:none;">
        <h1>מצב שבת</h1>
        <p id="welcomeUser" style="font-size:0.9em; color:#bbb; margin-bottom:25px;"></p>

        <div class="general-card">
            <h3>⚙️ הגדרות כלליות</h3>
            <p class="section-desc">הגדרות הקיוסק והתצוגה הציבורית</p>
            <div class="toggle-row">
                <div>
                    <span class="toggle-label">יום טוב שני</span>
                    <p class="toggle-sub">הקיוסק יכנס למצב שבת ביום השני של חגים</p>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle-yomtov-sheni">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div id="elevatorsContainer"></div>

        <button class="save-btn" onclick="saveShabbatStates()">שמור</button>
        <button class="logout-btn" id="logoutBtn">התנתק</button>
    </div>

    <div class="notification" id="notificationPopup"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const ui = {
            authContainer: document.getElementById('authContainer'),
            controlContainer: document.getElementById('controlContainer'),
            notificationPopup: document.getElementById('notificationPopup'),
            welcomeUser: document.getElementById('welcomeUser'),
            elevatorsContainer: document.getElementById('elevatorsContainer'),
        };

        function showNotification(message, isError = false) {
            ui.notificationPopup.textContent = message;
            ui.notificationPopup.style.backgroundColor = isError ? '#d32f2f' : '#c5a47e';
            ui.notificationPopup.style.color = isError ? '#fff' : '#1a1a2e';
            ui.notificationPopup.classList.add('show');
            setTimeout(() => ui.notificationPopup.classList.remove('show'), 3500);
        }

        function showAuthView(viewId) {
            document.querySelectorAll('.auth-view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // --- Auth ---
        document.getElementById('googleSignInBtn').addEventListener('click', () => {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => showNotification(e.message, true));
        });
        document.getElementById('emailSignInBtn').addEventListener('click', () => showAuthView('auth-email'));
        document.querySelectorAll('.back-btn').forEach(btn => btn.addEventListener('click', e => showAuthView(e.target.dataset.target)));

        document.getElementById('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            auth.signInWithEmailAndPassword(
                document.getElementById('loginEmail').value,
                document.getElementById('loginPassword').value
            ).catch(err => showNotification(err.message, true));
        });

        document.getElementById('forgotPasswordLink').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value;
            if (!email) { showNotification('הכנס אימייל תחילה', true); return; }
            auth.sendPasswordResetEmail(email)
                .then(() => showNotification('נשלח מייל לאיפוס סיסמה'))
                .catch(e => showNotification(e.message, true));
        });

        document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

        auth.onAuthStateChanged(user => {
            if (user) {
                const ref = user.email
                    ? database.ref('allowed_users').child(user.email.replace(/\./g, '_'))
                    : null;
                if (!ref) { showNotification('אין הרשאת גישה', true); auth.signOut(); return; }

                ref.once('value').then(snap => {
                    const val = snap.val();
                    const allowed = snap.exists() && (val === true || (typeof val === 'object' && val.allowed === true));
                    if (allowed) {
                        ui.authContainer.style.display = 'none';
                        ui.controlContainer.style.display = 'block';
                        ui.welcomeUser.textContent = `ברוך הבא, ${user.displayName || user.email}`;
                        loadElevators();
                    } else {
                        showNotification('אין לך הרשאת גישה', true);
                        auth.signOut();
                    }
                });
            } else {
                ui.authContainer.style.display = 'block';
                ui.controlContainer.style.display = 'none';
                showAuthView('auth-main');
            }
        });

        // --- Load elevators + global settings ---
        function loadElevators() {
            Promise.all([
                database.ref('elevator_configs').once('value'),
                database.ref('settings/YOM_TOV_SHENI').once('value')
            ]).then(([elevSnap, yomtovSnap]) => {
                const configs = elevSnap.val() || {};
                const yomtovSheni = yomtovSnap.val() !== false; // default: true
                document.getElementById('toggle-yomtov-sheni').checked = yomtovSheni;
                ui.elevatorsContainer.innerHTML = '';

                Object.keys(configs).sort().forEach(id => {
                    const isActive = configs[id].SHABBAT_ACTIVE !== undefined
                        ? configs[id].SHABBAT_ACTIVE
                        : true;

                    const card = document.createElement('div');
                    card.className = 'elevator-card';
                    card.innerHTML = `
                        <h3>מעלית ${id}</h3>
                        <div class="toggle-row">
                            <span class="toggle-label">מצב שבת פעיל</span>
                            <label class="switch">
                                <input type="checkbox" id="toggle-${id}" ${isActive ? 'checked' : ''}>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <p class="status-text ${isActive ? 'active' : ''}" id="status-${id}">
                            ${isActive ? 'פעיל — המעלית תפעל במצב שבת' : 'כבוי — המעלית לא תוצג'}
                        </p>
                    `;
                    ui.elevatorsContainer.appendChild(card);

                    document.getElementById(`toggle-${id}`).addEventListener('change', function() {
                        const statusEl = document.getElementById(`status-${id}`);
                        if (this.checked) {
                            statusEl.textContent = 'פעיל — המעלית תפעל במצב שבת';
                            statusEl.className = 'status-text active';
                        } else {
                            statusEl.textContent = 'כבוי — המעלית לא תוצג';
                            statusEl.className = 'status-text';
                        }
                    });
                });
            }).catch(e => showNotification('שגיאה בטעינה: ' + e.message, true));
        }


        // --- Save ---
        function saveShabbatStates() {
            const updates = {};
            document.querySelectorAll('[id^="toggle-"]').forEach(input => {
                const id = input.id.replace('toggle-', '');
                if (id === 'yomtov-sheni') {
                    updates['settings/YOM_TOV_SHENI'] = input.checked;
                } else {
                    updates[`elevator_configs/${id}/SHABBAT_ACTIVE`] = input.checked;
                }
            });

            database.ref().update(updates)
                .then(() => showNotification('נשמר בהצלחה!'))
                .catch(e => showNotification('שגיאה בשמירה', true));
        }
    </script>
</body>
</html>
