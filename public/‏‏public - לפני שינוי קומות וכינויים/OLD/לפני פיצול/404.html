<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>שגיאה 404 - דף לא נמצא</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- Global Theme Variables (From FLOOR8APP) --- */
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #2c3e50, #000000); 
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            --glass-border: 1px solid rgba(255, 255, 255, 0.18);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --gold-primary: #E6C25F; 
            --gold-muted: #C2A153;   
            --text-main: #F8FAFC;    
            --text-secondary: #CBD5E1; 
        }

        /* --- Reset & Body --- */
        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            font-family: 'Heebo', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* --- Logo Styling --- */
        .brand-logo {
            width: 300px;
            height: auto;
            object-fit: contain;
            margin-bottom: 20px;
            /* Gold drop shadow for premium feel */
            filter: drop-shadow(0 0 10px rgba(230, 194, 95, 0.3));
        }

        /* --- Typography --- */
        .main-title {
            color: var(--text-main);
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 25px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .status-text {
            color: var(--text-secondary);
            font-size: 1.2rem;
            font-weight: 400;
            margin-top: 25px;
            letter-spacing: 0.5px;
        }

        /* --- The Glass Panel --- */
        .elevator-display-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            padding: 20px;
            width: 90%;
            max-width: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Slight animation like the elevator cards */
            transition: transform 0.3s ease;
        }

        .elevator-display-panel:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* --- Digital Display (The "Screen") --- */
        .digital-display {
            background: rgba(0, 0, 0, 0.4); /* Darker inner screen */
            border-radius: 12px;
            padding: 15px 0;
            width: 100%;
            border: 1px solid rgba(230, 194, 95, 0.1); /* Faint gold border */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        
        .floor-number {
            font-family: 'Heebo', sans-serif; /* Keeping consistency with app */
            font-size: 5rem;
            font-weight: 800;
            color: var(--gold-primary);
            line-height: 1;
            display: block;
            /* Gold Glow Effect */
            text-shadow: 0 0 20px rgba(230, 194, 95, 0.6);
        }

        /* --- Footer --- */
        .footer-text {
            position: fixed;
            bottom: 20px;
            width: 100%;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.6;
        }

        .footer-text p {
            margin: 4px 0;
        }

        .footer-text a {
            color: var(--gold-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s, text-shadow 0.3s;
            border-bottom: 1px dotted var(--gold-muted);
        }

        .footer-text a:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--gold-primary);
        }

        /* --- Mobile Optimization --- */
        @media (max-height: 500px) and (orientation: landscape) {
            .brand-logo { width: 80px; margin-bottom: 10px; }
            .main-title { font-size: 1.5rem; margin-bottom: 15px; }
            .floor-number { font-size: 3.5rem; }
            .footer-text { position: relative; bottom: auto; margin-top: 20px; }
        }
    </style>
</head>
<body>

    <img src="https://firebasestorage.googleapis.com/v0/b/nitzaelev.firebasestorage.app/o/Powered%20by_LOGO_.png?alt=media&token=a3a3d8fe-213d-4102-ac82-3848dc1e96d0" alt="Nitza Logo" class="brand-logo">

    <h1 class="main-title">אופס! משהו השתבש</h1>

    <div class="elevator-display-panel">
        <div class="digital-display">
            <span class="floor-number">404</span>
        </div>
    </div>

    <h2 class="status-text">העמוד המבוקש לא נמצא</h2>

    <div class="footer-text">
        <p>מופעל ע"י ECONTROL פתרונות מתקדמים לבקרה וניהול מבנים.</p>
        <p>ליצירת קשר לחצו <a href="https://wa.me/972525705289" target="_blank">כאן</a></p>
    </div>

</body>
</html>
