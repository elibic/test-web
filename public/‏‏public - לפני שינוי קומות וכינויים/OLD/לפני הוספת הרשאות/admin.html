<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פאנל ניהול ראשי</title>
    <link href="https://fonts.googleapis.com/css?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', Arial, sans-serif; background: linear-gradient(120deg, #141E30 0%, #243B55 100%); color: #ecd08f; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; box-sizing: border-box; }
        h1, h2, h3 { color: #ecd08f; margin-bottom: 20px; }
        .container { background: rgba(20, 30, 48, 0.97); border-radius: 28px; box-shadow: 0 6px 48px #0007, 0 1.5px 3px #ecd08f40 inset; padding: 30px; width: 90%; max-width: 900px; border: 2px solid #ecd08f; margin-bottom: 20px; position: relative; }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; color: #ecd08f; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ecd08f; border-radius: 8px; background-color: rgba(255, 255, 255, 0.1); color: #ecd08f; box-sizing: border-box; font-family: inherit; font-size: 1em; }
        button { background: linear-gradient(90deg, #262c43 60%, #14192c 100%); color: #ecd08f; border: 2px solid #ecd08f; border-radius: 18px; font-size: 1.1em; font-family: inherit; padding: 10px 25px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 25px #ecd08f18; transition: all 0.2s; width: 100%; margin-top: 10px;}
        button:hover { background: linear-gradient(90deg, #1c2130 80%, #fcdf83 120%); color: #ffe9a1; }
        .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; color: #333; border-color: #fff; }
        .social-btn:hover { background: #f0f0f0; color: #000; }
        .back-btn { background: transparent; border-color: #ecd08f80; }
        .auth-view { display: none; flex-direction: column; gap: 15px; }
        .auth-view.active { display: flex; }
        .forgot-password { color: #ecd08f; text-decoration: underline; cursor: pointer; font-size: 0.9em; text-align: center; margin-top: 15px; display: block; }
        .logout-btn { background-color: #d32f2f; border-color: #d32f2f; position: absolute; top: 20px; left: 20px; width: auto; }
        .list-container { margin-top: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #141E30; padding: 10px; border-radius: 4px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; width: auto; margin: 0; }
        .notification { visibility: hidden; opacity: 0; min-width: 200px; background: #ecd08f; color: #243B55; text-align: center; border-radius: 12px; padding: 15px 25px; position: fixed; z-index: 1001; left: 50%; bottom: 50px; font-size: 1em; transform: translateX(-50%); box-shadow: 0 2px 18px #0007; transition: opacity 0.3s, visibility 0.3s; font-weight: bold; }
        .notification.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>
    
    <div id="authContainer" class="container">
        <h2>כניסה לפאנל ניהול משתמשים</h2>
        <div id="auth-main" class="auth-view active">
            <button id="googleSignInBtn" class="social-btn"><svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9.18v3.48h4.74c-.2 1.13-.83 2.08-1.78 2.72v2.26h2.9c1.7-1.56 2.68-3.87 2.68-6.62z"></path><path fill="#34A853" d="M9.18 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-2.97.86-2.3 0-4.26-1.56-4.96-3.66H1.2v2.33C2.68 15.98 5.67 18 9.18 18z"></path><path fill="#FBBC05" d="M4.22 10.74c-.14-.42-.22-.88-.22-1.34s.08-.92.22-1.34V5.73H1.2C.43 7.1.01 8.7.01 10.4c0 1.7.42 3.3 1.19 4.67l3.02-2.33z"></path><path fill="#EA4335" d="M9.18 3.54c1.32 0 2.5.45 3.44 1.34l2.58-2.58C13.65.88 11.61 0 9.18 0 5.67 0 2.68 2.02 1.2 4.93l3.02 2.33c.7-2.1 2.66-3.66 4.96-3.66z"></path></svg>התחבר עם Google</button>
            <button id="phoneSignInBtn">התחבר עם מספר טלפון</button>
            <button id="emailSignInBtn">התחבר עם אימייל וסיסמה</button>
        </div>
        <div id="auth-email" class="auth-view"><form id="loginForm"><input type="email" id="loginEmail" placeholder="אימייל" required><input type="password" id="loginPassword" placeholder="סיסמה" required><button type="submit">התחבר</button><a class="forgot-password" id="forgotPasswordLink">שכחתי סיסמה</a></form><button class="back-btn" data-target="auth-main">חזור</button></div>
        <div id="auth-phone-step1" class="auth-view"><input type="tel" id="phoneNumber" placeholder="הכנס מספר טלפון (לדוגמה: 0501234567)"><button id="sendCodeBtn">שלח קוד אימות</button><div id="recaptcha-container"></div><button class="back-btn" data-target="auth-main">חזור</button></div>
        <div id="auth-phone-step2" class="auth-view"><input type="number" id="verificationCode" placeholder="הכנס קוד בן 6 ספרות"><button id="verifyCodeBtn">אמת קוד והתחבר</button><button class="back-btn" data-target="auth-phone-step1">חזור</button></div>
    </div>

    <div id="adminPanel" class="container" style="display: none;">
        <button id="logoutBtn" class="logout-btn">התנתק</button>
        <h1>פאנל ניהול ראשי</h1>
        
        <div class="container">
            <h3>הוספת משתמש חדש</h3>
            <form id="addUserForm">
                <div class="form-group"><label for="newUserName">שם המשתמש (לזיהוי שלך):</label><input type="text" id="newUserName" required></div>
                <div class="form-group"><label for="newUserEmail">אימייל:</label><input type="email" id="newUserEmail" required></div>
                <div class="form-group"><label for="newUserPassword">סיסמה ראשונית:</label><input type="password" id="newUserPassword" required></div>
                <div class="form-group"><label for="newUserPhone">טלפון (אופציונלי):</label><input type="tel" id="newUserPhone" placeholder="0501234567"></div>
                <button type="submit">צור משתמש והוסף הרשאה</button>
            </form>
        </div>

        <div class="list-container"><h2>אימיילים מורשים</h2><ul id="emailList"></ul></div>
        <div class="list-container"><h2>טלפונים מורשים</h2><ul id="phoneList"></ul></div>
    </div>
    <div class="notification" id="notificationPopup"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyABExU11JS2KsumwG5z6-X_Tnn_OJZkusg",
  authDomain: "nitzaelev.firebaseapp.com",
  databaseURL: "https://nitzaelev-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "nitzaelev",
  storageBucket: "nitzaelev.firebasestorage.app",
  messagingSenderId: "922911314024",
  appId: "1:922911314024:web:560493db03aa477cd7ebdd",
  measurementId: "G-6BQ4RTV03F"
        };        

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();
        const functions = firebase.functions();

        // --- UI Elements ---
        const ui = {
            authContainer: document.getElementById('authContainer'),
            adminPanel: document.getElementById('adminPanel'),
            notificationPopup: document.getElementById('notificationPopup'),
            authViews: document.querySelectorAll('.auth-view'),
            googleSignInBtn: document.getElementById('googleSignInBtn'),
            phoneSignInBtn: document.getElementById('phoneSignInBtn'),
            emailSignInBtn: document.getElementById('emailSignInBtn'),
            sendCodeBtn: document.getElementById('sendCodeBtn'),
            verifyCodeBtn: document.getElementById('verifyCodeBtn'),
            logoutBtn: document.getElementById('logoutBtn'),
            forgotPasswordLink: document.getElementById('forgotPasswordLink'),
            loginForm: document.getElementById('loginForm'),
            phoneNumberInput: document.getElementById('phoneNumber'),
            verificationCodeInput: document.getElementById('verificationCode'),
            addUserForm: document.getElementById('addUserForm'),
            emailList: document.getElementById('emailList'),
            phoneList: document.getElementById('phoneList')
        };
        
        // --- Helper Functions ---
        function showNotification(message, isError = false) {
            ui.notificationPopup.textContent = message;
            ui.notificationPopup.style.backgroundColor = isError ? '#d32f2f' : '#ecd08f';
            ui.notificationPopup.style.color = isError ? '#fff' : '#243B55';
            ui.notificationPopup.classList.add('show');
            setTimeout(() => ui.notificationPopup.classList.remove('show'), 4000);
        }
        function showAuthView(viewId) {
            ui.authViews.forEach(view => view.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }
        function normalizeIsraeliPhoneNumber(phone) {
            if (!phone) return null;
            let cleaned = ('' + phone).replace(/\D/g, '');
            if (cleaned.length === 10 && cleaned.startsWith('0')) { return '+972' + cleaned.substring(1); }
            if (cleaned.length === 12 && cleaned.startsWith('972')) { return '+' + cleaned; }
            return null;
        }
        function translateFirebaseError(errorCode) {
            switch (errorCode) {
                case 'auth/user-not-found': return 'לא נמצא משתמש עם כתובת אימייל זו.';
                case 'auth/wrong-password': return 'הסיסמה שהוזנה שגויה.';
                case 'auth/invalid-email': return 'כתובת האימייל שהוזנה אינה תקינה.';
                case 'auth/email-already-in-use': return 'כתובת אימייל זו כבר רשומה במערכת.';
                case 'auth/weak-password': return 'הסיסמה חלשה מדי. נדרשים לפחות 6 תווים.';
                case 'auth/too-many-requests': return 'נחסמת זמנית עקב יותר מדי ניסיונות. נסה שוב מאוחר יותר.';
                case 'auth/invalid-phone-number': return 'מספר הטלפון שהוזן אינו תקין.';
                case 'auth/invalid-verification-code': return 'הקוד שהוזן שגוי.';
                case 'auth/network-request-failed': return 'אירעה שגיאת רשת. בדוק את חיבור האינטרנט.';
                case 'auth/invalid-app-credential': return 'שגיאת אימות. ודא שהדומיין localhost מורשה ב-Firebase.';
                default: return 'אירעה שגיאה לא ידועה. נסה שוב.';
            }
        }
        
        // --- Navigation & Auth Listeners ---
        ui.googleSignInBtn.addEventListener('click', () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => showNotification(translateFirebaseError(err.code), true)));
        ui.phoneSignInBtn.addEventListener('click', () => showAuthView('auth-phone-step1'));
        ui.emailSignInBtn.addEventListener('click', () => showAuthView('auth-email'));
        document.querySelectorAll('.back-btn').forEach(btn => btn.addEventListener('click', (e) => showAuthView(e.target.dataset.target)));
        ui.logoutBtn.addEventListener('click', () => auth.signOut());

        // --- Super Admin Access Control ---
        auth.onAuthStateChanged(user => {
            if (user) {
                const encodedEmail = (user.email || "").replace(/\./g, '_');
                const userPhone = user.phoneNumber;
                let isSuperAdmin = false;
                const checks = [];

                if(user.email) checks.push(database.ref('super_admins').child(encodedEmail).once('value'));
                if(userPhone) checks.push(database.ref('super_admins_phone').child(userPhone).once('value'));
                
                Promise.all(checks).then(snapshots => {
                    snapshots.forEach(snapshot => { if (snapshot.exists() && snapshot.val() === true) isSuperAdmin = true; });
                    if (isSuperAdmin) {
                        ui.authContainer.style.display = 'none';
                        ui.adminPanel.style.display = 'block';
                        loadAndDisplayLists();
                    } else {
                        showNotification("אין לך הרשאת גישה לדף זה.", true);
                        auth.signOut();
                    }
                });
            } else {
                ui.authContainer.style.display = 'block';
                ui.adminPanel.style.display = 'none';
                showAuthView('auth-main');
            }
        });

        // --- Login Forms Logic ---
        ui.loginForm.addEventListener('submit', e => {
            e.preventDefault();
            auth.signInWithEmailAndPassword(e.target.loginEmail.value, e.target.loginPassword.value)
                .catch(err => showNotification(translateFirebaseError(err.code), true));
        });
        function setupRecaptcha() { window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {'size': 'invisible'}); }
        setupRecaptcha();
        ui.sendCodeBtn.addEventListener('click', () => {
            const formattedPhoneNumber = normalizeIsraeliPhoneNumber(ui.phoneNumberInput.value);
            if (!formattedPhoneNumber) { showNotification('המספר שהוזן אינו תקין.', true); return; }
            auth.signInWithPhoneNumber(formattedPhoneNumber, window.recaptchaVerifier)
                .then(res => { window.confirmationResult = res; showNotification('קוד אימות נשלח לנייד.'); showAuthView('auth-phone-step2'); })
                .catch(err => showNotification(translateFirebaseError(err.code), true));
        });
        ui.verifyCodeBtn.addEventListener('click', () => {
            if (!window.confirmationResult) return;
            window.confirmationResult.confirm(ui.verificationCodeInput.value).catch(err => showNotification(translateFirebaseError(err.code), true));
        });

        // --- Admin Panel Logic ---
        function loadAndDisplayLists() {
            database.ref('allowed_users').on('value', snapshot => {
                ui.emailList.innerHTML = '';
                const data = snapshot.val() || {};
                Object.keys(data).forEach(encodedKey => {
                    const originalEmail = encodedKey.replace(/_/g, '.');
                    const li = document.createElement('li');
                    li.textContent = originalEmail;
                    li.innerHTML += ` <button class="delete-btn" data-type="email" data-value="${encodedKey}">מחק</button>`;
                    ui.emailList.appendChild(li);
                });
            });
            database.ref('allowed_phone_numbers').on('value', snapshot => {
                ui.phoneList.innerHTML = '';
                const data = snapshot.val() || {};
                Object.keys(data).forEach(key => {
                    const li = document.createElement('li');
                    li.textContent = key;
                    li.innerHTML += ` <button class="delete-btn" data-type="phone" data-value="${key}">מחק</button>`;
                    ui.phoneList.appendChild(li);
                });
            });
        }
        
        ui.addUserForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const displayName = document.getElementById('newUserName').value;
            const email = document.getElementById('newUserEmail').value;
            const password = document.getElementById('newUserPassword').value;
            const phone = document.getElementById('newUserPhone').value;
            const createNewUser = functions.httpsCallable('createNewUser');
            showNotification('יוצר משתמש, אנא המתן...');
            createNewUser({ displayName, email, password, phone })
                .then(result => { showNotification('המשתמש נוצר והוסף להרשאות בהצלחה!'); ui.addUserForm.reset(); })
                .catch(error => { console.error("Error creating user:", error); showNotification(`שגיאה ביצירת המשתמש: ${error.message}`, true); });
        });
        
        function handleDelete(e) {
            if (!e.target.classList.contains('delete-btn')) return;
            const type = e.target.dataset.type;
            const value = e.target.dataset.value;
            const path = (type === 'email') ? 'allowed_users' : 'allowed_phone_numbers';
            if (confirm(`האם למחוק הרשאה זו?`)) { database.ref(path).child(value).remove(); }
        }
        ui.emailList.addEventListener('click', handleDelete);
        ui.phoneList.addEventListener('click', handleDelete);
    </script>
</body>
</html>
