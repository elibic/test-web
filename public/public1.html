<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעלית שבת - תצוגת קיוסק ציבורית</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="kiosk-style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-config.js"></script>
</head>

<body class="weekday-mode">

  <!-- Error screen -->
  <div id="errorScreen">
    <i class="fas fa-exclamation-triangle" style="font-size:3.5em;margin-bottom:18px;color:var(--gold);"></i>
    <h2 style="color:var(--text);">שגיאת קונפיגורציה</h2>
    <p style="color:var(--text);">לא הוגדרה קומה עבור מסך זה.</p>
    <p style="direction:ltr;background:rgba(255,255,255,.85);padding:10px 16px;border-radius:8px;color:var(--text);border:1px solid var(--gold);font-size:.95em;">
      Add <b>?floor=X</b> to the URL.<br>Example: <i>public.html?floor=5</i>
    </p>
  </div>

  <!-- HEADER -->
  <header class="kiosk-header">
    <img id="mainLogo" class="top-logo" src="https://firebasestorage.googleapis.com/v0/b/ramada-elev.firebasestorage.app/o/ramada_logo.png?alt=media&token=b5f74f15-0d5b-477c-9059-b96a85db507b" alt="לוגו">
  </header>

  <!-- SHABBAT BANNER -->
  <div id="main-shabbat-indicator">
    <svg class="shabbat-candle-svg" viewBox="0 0 100 200" fill="none"
         stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M35 190 C 40 170, 60 170, 65 190"/>
      <rect x="42" y="90" width="16" height="100" rx="2"/>
      <path d="M50 90 V 80"/>
      <path d="M50 75 C 45 60, 55 40, 50 20 C 45 40, 55 60, 50 75 Z"/>
    </svg>
    <span>שבת שלום</span>
    <svg class="shabbat-candle-svg" viewBox="0 0 100 200" fill="none"
         stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M35 190 C 40 170, 60 170, 65 190"/>
      <rect x="42" y="90" width="16" height="100" rx="2"/>
      <path d="M50 90 V 80"/>
      <path d="M50 75 C 45 60, 55 40, 50 20 C 45 40, 55 60, 50 75 Z"/>
    </svg>
  </div>

  <!-- DISPLAY CONTAINER -->
  <div id="displayContainer">
    <div class="dashboard-container" role="region" aria-label="פאנלי מעליות" aria-live="polite"></div>
    <div id="clockContainer">
      <div class="clock-panel">
        <div class="clock-time" id="clockTime">00:00</div>
        <div class="clock-date" id="clockDate"></div>
        <div class="clock-hebrew-date" id="clockHebrewDate"></div>
      </div>
    </div>
  </div>

  <!-- NOTIFICATION -->
  <div class="notification" id="notificationPopup" role="status" aria-live="assertive"></div>

  <!-- BOTTOM STATUS BAR -->
  <div class="bottom-status-bar" id="bottomStatusBar">
    <!-- QR + promo -->
    <div class="bar-qr-side">
      <div class="bar-qr-code" id="qrPromoCode"></div>
      <div class="bar-qr-text">
        <span class="bar-qr-title">מעלית שבת אצלכם בסלון</span>
        <span class="bar-qr-sub">סרקו וצאו בדיוק בזמן — בלי לחכות במסדרון</span>
      </div>
    </div>
    <!-- Center powered-by -->
    <div class="bar-logo-center">
      <img id="poweredByLogo" src="https://firebasestorage.googleapis.com/v0/b/wolfsonelev.firebasestorage.app/o/Powered%20by_LOGO.png?alt=media&token=0e6c3ae5-24d7-49a1-bcc4-ab4c244adae3" alt="Powered By" class="bar-powered-logo">
    </div>
    <!-- Time -->
    <div class="bar-time-side">
      <span class="status-time" id="statusTime">00:00:00</span>
      <span class="bar-separator">|</span>
      <span id="statusDate"></span>
      <span class="bar-separator">|</span>
      <span id="statusHebrewDate"></span>
    </div>
  </div>

  <!-- LOGIC -->
  <script src="kiosk-logic.js"></script>
  <script>
  /* ── Force-hide clock in weekday-mode (overrides kiosk-logic.js inline style) ── */
  (function() {
    var clockEl = document.getElementById('clockContainer');
    if (!clockEl) return;
    function forceHide() {
      if (document.body.classList.contains('weekday-mode')) {
        clockEl.style.setProperty('display','none','important');
      }
    }
    forceHide();
    setInterval(forceHide, 80);
  })();
  </script>

  <script>
  (function () {
    /* ── Elevator name splitter: "מעלית" small + letter big ── */
    function splitElevatorId(el) {
      if (el.querySelector('.elev-label')) return;
      var text = el.textContent.trim();
      var match = text.match(/^(מעלית|Elevator)\s*(.+)$/);
      if (match) {
        el.innerHTML =
          '<span class="elev-label">' + match[1] + '</span>' +
          '<span class="elev-name">' + match[2] + '</span>';
      }
    }
    function processAll() {
      document.querySelectorAll('.elevator-id').forEach(splitElevatorId);
    }
    new MutationObserver(function (mutations) {
      mutations.forEach(function (m) {
        m.addedNodes.forEach(function (node) {
          if (node.nodeType !== 1) return;
          if (node.classList && node.classList.contains('elevator-id')) splitElevatorId(node);
          node.querySelectorAll && node.querySelectorAll('.elevator-id').forEach(splitElevatorId);
        });
      });
    }).observe(document.body, { childList: true, subtree: true });
    var tries = 0;
    var iv = setInterval(function () { processAll(); if (++tries > 20) clearInterval(iv); }, 400);

    /* ── QR Code ── */
    var qrEl = document.getElementById('qrPromoCode');
    if (qrEl && typeof QRCode !== 'undefined') {
      QRCode.toCanvas(document.createElement('canvas'), 'https://ramada.econtrol.co.il/', {
        width: 256, margin: 1,
        color: { dark: '#1a1a2e', light: '#ffffff' }
      }, function (err, canvas) {
        if (!err && canvas) {
          canvas.style.borderRadius = '8px';
          canvas.style.width = '100%';
          canvas.style.height = '100%';
          qrEl.appendChild(canvas);
        }
      });
    }
  })();
  </script>

</body>
</html>
