<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעלית שבת - תצוגת קיוסק</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="kiosk-style.css">
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    
    <!-- Firebase SDK (Compat v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Configuration & Logic -->
    <script src="/firebase-config.js"></script>

    <!-- Display-Specific Clean Styles -->
    <style>
        /* Container centered and full height */
        #clockContainer {
            display: flex !important;
            height: 85vh; 
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Hide Large Clock when Elevators are visible (Shabbat Mode) */
        body.shabbat-mode-active #clockContainer {
            display: none !important;
        }

        /* Clean Digital Panel */
        #digitalClockPanel {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Typography Enhancements */
        .clock-time {
            font-size: 22vw; 
            font-weight: 300;
            color: var(--gold-primary);
            line-height: 0.9;
            margin-bottom: 2vh;
            font-variant-numeric: tabular-nums;
        }

        .clock-date {
            font-size: 5vw;
            color: var(--text-main); 
            font-weight: 400;
            margin-bottom: 1.5vh;
        }

        .clock-hebrew-date {
            font-size: 3.5vw;
            color: var(--text-secondary); 
            font-weight: 400;
            opacity: 0.9;
        }

        #analogClockWrapper {
            display: none !important;
        }

        @media (orientation: landscape) {
            .clock-time { font-size: 20vw; }
            .clock-date { font-size: 4vw; }
            .clock-hebrew-date { font-size: 3vw; }
        }
    </style>
</head>

<body>
    
    <!-- Error Screen -->
    <div id="errorScreen">
        <i class="fas fa-exclamation-triangle" style="font-size: 4em; margin-bottom: 20px;"></i>
        <h2>שגיאת קונפיגורציה</h2>
        <p>לא הוגדרה קומה עבור מסך זה.</p>
        <p style="direction: ltr; background: #111; padding: 10px; border-radius: 4px; color: #fff;">
            Add <b>?floor=X</b> to the URL.<br>Example: <i>display.html?floor=5</i>
        </p>
    </div>

    <!-- Top Logo -->
    <img id="mainLogo" class="top-logo" src="" alt="Main Logo">

    <div id="displayContainer">
        
        <div id="main-shabbat-indicator">
            <svg class="shabbat-candle-svg" viewBox="0 0 100 200" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M35 190 C 40 170, 60 170, 65 190" />
                <rect x="42" y="90" width="16" height="100" rx="2" />
                <path d="M50 90 V 80" />
                <path d="M50 75 C 45 60, 55 40, 50 20 C 45 40, 55 60, 50 75 Z" />
            </svg>
            
            <span>שבת שלום</span>
            
            <svg class="shabbat-candle-svg" viewBox="0 0 100 200" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M35 190 C 40 170, 60 170, 65 190" />
                <rect x="42" y="90" width="16" height="100" rx="2" />
                <path d="M50 90 V 80" />
                <path d="M50 75 C 45 60, 55 40, 50 20 C 45 40, 55 60, 50 75 Z" />
            </svg>
        </div>
        
        <div id="clockContainer">
            <div id="digitalClockPanel" class="clock-panel">
                <div class="clock-time" id="clockTime">00:00:00</div>
                <div class="clock-date" id="clockDate">טוען תאריך...</div>
                <div class="clock-hebrew-date" id="clockHebrewDate">טוען תאריך עברי...</div>
            </div>
        </div>
        
        <div class="dashboard-container"></div>
    </div>
    
    <img id="poweredByLogo" src="" alt="Powered By Logo" class="bottom-logo">
    <div class="notification" id="notificationPopup"></div>
    
    <div class="bottom-status-bar" id="bottomStatusBar">
        <span class="status-time" id="statusTime" style="font-weight:400; color: var(--gold-primary);">00:00:00</span> | 
        <span id="statusDate"></span> | 
        <span id="statusHebrewDate" style="margin-right: 8px;"></span>
    </div>

    <!-- Main Logic -->
    <script src="kiosk-logic.js"></script>
</body>
</html>
