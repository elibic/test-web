<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעלית שבת - תצוגת קיוסק</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="/kiosk-style.css?v=20260630-appear1">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    
    <!-- Firebase SDK (Compat v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Configuration & Logic -->
    <script src="/firebase-config.js"></script>
    <script src="/appearance.js?v=20260630-appear1"></script>
</head>

<body class="layout-v2 layout-kiosk">

    <!-- Error Screen -->
    <div id="errorScreen">
        <i class="fas fa-exclamation-triangle" style="font-size: 4em; margin-bottom: 20px;"></i>
        <h2>שגיאת קונפיגורציה</h2>
        <p>לא הוגדרה קומה עבור מסך זה.</p>
        <p style="direction: ltr; background: #111; padding: 10px; border-radius: 4px; color: #fff;">
            Add <b>?floor=X</b> to the URL.<br>Example: <i>kiosk.html?floor=5</i>
        </p>
    </div>

    <!-- Top Logo -->
    <img id="mainLogo" class="top-logo" src="" alt="Main Logo">

    <div id="displayContainer">

        <div id="systemBanners" class="system-banners"></div>

        <div id="main-shabbat-indicator">
            <svg class="shabbat-candle-svg" viewBox="0 0 100 200" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M35 190 C 40 170, 60 170, 65 190" />
                <rect x="42" y="90" width="16" height="100" rx="2" />
                <path d="M50 90 V 80" />
                <path d="M50 75 C 45 60, 55 40, 50 20 C 45 40, 55 60, 50 75 Z" />
            </svg>
            
            <span>שבת שלום</span>
            
            <svg class="shabbat-candle-svg" viewBox="0 0 100 200" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M35 190 C 40 170, 60 170, 65 190" />
                <rect x="42" y="90" width="16" height="100" rx="2" />
                <path d="M50 90 V 80" />
                <path d="M50 75 C 45 60, 55 40, 50 20 C 45 40, 55 60, 50 75 Z" />
            </svg>
        </div>
        
        <div id="clockContainer">
            <div id="digitalClockPanel" class="clock-panel">
                <div class="clock-time" id="clockTime">00:00:00</div>
                <div class="clock-date" id="clockDate">טוען תאריך...</div>
                <div class="clock-hebrew-date" id="clockHebrewDate">טוען תאריך עברי...</div>
            </div>
            
            <div id="analogClockWrapper">
                <div id="analogClockPanel" class="analog-clock-panel">
                    <div class="clock-face">
                        <div class="number number-12">12</div>
                        <div class="number number-1">1</div>
                        <div class="number number-2">2</div>
                        <div class="number number-3">3</div>
                        <div class="number number-4">4</div>
                        <div class="number number-5">5</div>
                        <div class="number number-6">6</div>
                        <div class="number number-7">7</div>
                        <div class="number number-8">8</div>
                        <div class="number number-9">9</div>
                        <div class="number number-10">10</div>
                        <div class="number number-11">11</div>

                        <div class="hand hour-hand" id="hourHand"></div>
                        <div class="hand minute-hand" id="minuteHand"></div>
                        <div class="hand second-hand" id="secondHand"></div>
                        <div class="center-dot"></div>
                    </div>
                </div>
                <div class="analog-clock-date-container">
                    <div class="analog-clock-date" id="analogClockDate">טוען תאריך...</div>
                    <div class="analog-clock-hebrew-date" id="analogClockHebrewDate">טוען תאריך עברי...</div>
                </div>
            </div>
        </div>
        
        <div class="dashboard-container"></div>
        
        <div class="footer-controls">
            <button id="contactBtn" class="control-btn settings-btn"><i class="fas fa-phone"></i></button>
            <button id="toggleClockBtn" class="control-btn settings-btn"><i class="fas fa-clock"></i></button>
            <button id="manualShabbatBtn" class="control-btn settings-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 22h-2v-11h2v11zm-1-16c-1.1 0-2 1.3-2 3s.9 3 2 3 2-1.3 2-3-.9-3-2-3zM18 22h-2v-11h2v11zm-1-16c-1.1 0-2 1.3-2 3s.9 3 2 3 2-1.3 2-3-.9-3-2-3z"/>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Dynamic Logo -->
    <img id="poweredByLogo" src="" alt="Powered By Logo" class="bottom-logo">
    <div class="notification" id="notificationPopup"></div>
    
    <div class="bottom-status-bar" id="bottomStatusBar">
        <span class="status-time" id="statusTime" style="font-weight:400; color: var(--gold-primary);">00:00:00</span> | 
        <span id="statusDate"></span> | 
        <span id="statusHebrewDate" style="margin-right: 8px;"></span>
    </div>

    <div id="contactModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modalCloseBtn">&times;</span>
            <h2 class="modal-title" id="contactTitle">ECONTROL פתרונות חכמים</h2>
            <p class="modal-text" id="contactPhoneText">טלפון ליצירת קשר: 052-5705289</p>
            <div class="qr-container">
                <canvas id="whatsappQRContainer"></canvas>
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="qr-logo" alt="WhatsApp Logo">
            </div>
        </div>
    </div>

    <!-- Main Logic -->
    <script src="/kiosk-logic.js?v=20260630-appear1"></script>
</body>
</html>
